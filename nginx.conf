worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
  use epoll;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ── Trust the host nginx's forwarded client IP ─────────────────
  # This container only ever receives traffic from the host nginx
  # (127.0.0.1:8080 -> here), which always arrives from the Docker
  # bridge gateway. Without this, $remote_addr is that single gateway
  # IP for every real visitor, collapsing all per-IP rate limiting
  # below into one shared, site-wide bucket.
  set_real_ip_from 172.18.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # ── Logging ──────────────────────────────────────────────────
  log_format main '$remote_addr - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  # ── Performance ───────────────────────────────────────────────
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  server_tokens off;
  client_max_body_size 35M;

  # ── Gzip compression ──────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types
    text/plain text/css text/xml text/javascript
    application/json application/javascript application/xml
    application/rss+xml image/svg+xml font/ttf font/otf
    application/x-font-ttf application/vnd.ms-fontobject;

  # ── Rate limiting zones ───────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api:10m  rate=60r/m;
  limit_conn_zone $binary_remote_addr zone=perip:10m;

  # ── Proxy cache ───────────────────────────────────────────────
  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC:10m
                   inactive=7d use_temp_path=off;

  # ─────────────────────────────────────────────────────────────
  # Upstream — Next.js app container
  # ─────────────────────────────────────────────────────────────
  upstream nextjs_app {
    server app:3000;
    keepalive 32;
  }

  # ─────────────────────────────────────────────────────────────
  # Static marketing landing page (public homepage)
  # Mounted read-only into the nginx container at /opt/landing —
  # see the `nginx` service volume in docker-compose.yml.
  # ─────────────────────────────────────────────────────────────

  # ─────────────────────────────────────────────────────────────
  # Server block
  # ─────────────────────────────────────────────────────────────
  server {
    listen 80;
    server_name _;

    # ── Security headers ──────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https://images.unsplash.com https://upload.wikimedia.org https://placehold.co https://placehold.it https://utfs.io; font-src 'self'; connect-src 'self' https://*.startupet.et; frame-ancestors 'none'; upgrade-insecure-requests;" always;

    # ── Rate limit on auth routes ─────────────────────────────
    location ~ ^/auth/ {
      limit_req zone=auth burst=5 nodelay;
      limit_conn perip 5;
      proxy_pass http://nextjs_app;
      include /etc/nginx/proxy_params.conf;
    }

    # ── Rate limit on API routes ──────────────────────────────
    location ~ ^/api/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://nextjs_app;
      include /etc/nginx/proxy_params.conf;
    }

    # ── Static assets — long cache ────────────────────────────
    # Two independent Next.js builds (the platform app and the static
    # landing export) both emit hashed chunks under this same prefix.
    # Check the landing's files on disk first (content-hashed filenames
    # make cross-build collisions effectively impossible); anything not
    # found there is the platform's own build, proxied through as before.
    location /_next/static/ {
      root /opt/landing;
      try_files $uri @nextjs_static;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }

    location @nextjs_static {
      proxy_cache STATIC;
      proxy_pass http://nextjs_app;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      include /etc/nginx/proxy_params.conf;
    }

    # ── Marketing landing page (public homepage) ───────────────
    # Pre-compiled static export, served straight from disk.
    # Platform routes (/auth, /dashboard, /api, admin portals, ...)
    # are untouched — none of them collide with these paths.
    location = / {
      root /opt/landing;
      try_files /index.html =404;
    }

    location ~ ^/(about-us|process|team|faq|contact|Designation)/?$ {
      root /opt/landing;
      try_files $uri $uri/index.html =404;
    }

    location /img/ {
      root /opt/landing;
    }

    location /css/ {
      root /opt/landing;
    }

    location /js/ {
      root /opt/landing;
    }

    location /video/ {
      root /opt/landing;
    }

    location = /favicon.ico {
      root /opt/landing;
      try_files /favicon.ico =404;
    }

    error_page 404 /404/index.html;
    location = /404/index.html {
      root /opt/landing;
      internal;
    }

    # ── Public files ──────────────────────────────────────────
    location /public/ {
      proxy_cache STATIC;
      proxy_pass http://nextjs_app;
      add_header Cache-Control "public, max-age=86400" always;
      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
      include /etc/nginx/proxy_params.conf;
    }

    # ── Everything else ───────────────────────────────────────
    location / {
      proxy_pass http://nextjs_app;
      include /etc/nginx/proxy_params.conf;
    }
  }
}
